components:
  schemas:
    Alerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        placa:
          type: string
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        atendida:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        paso:
          type: integer
      required:
      - created_at
      - id
      - paso
      - placa
      - tipo
    BlankEnum:
      enum:
      - ''
    Caseta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        ubicacion:
          type: string
          maxLength: 200
      required:
      - id
      - nombre
      - ubicacion
    CasetaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        ubicacion:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - nombre
      - ubicacion
    CategoriaDetectadaEnum:
      enum:
      - moto
      - auto
      - minibus
      - camion
      - bus
      type: string
      description: |-
        * `moto` - Motocicleta
        * `auto` - Automóvil
        * `minibus` - Minibús
        * `camion` - Camión
        * `bus` - Bus
    CategoriaEnum:
      enum:
      - moto
      - auto
      - minibus
      - camion
      - bus
      type: string
      description: |-
        * `moto` - Motocicleta
        * `auto` - Automóvil
        * `minibus` - Minibús
        * `camion` - Camión
        * `bus` - Bus
    ChatRequestRequest:
      type: object
      properties:
        mensaje:
          type: string
        imagen:
          type: string
          format: binary
    ConsultaImagenRequest:
      type: object
      properties:
        imagen:
          type: string
          format: binary
      required:
      - imagen
    ConsultaPlacaRequest:
      type: object
      properties:
        placa:
          type: string
          minLength: 1
          maxLength: 30
      required:
      - placa
    EstadoEnum:
      enum:
      - aprobado
      - placa_desconocida
      - saldo_insuficiente
      - revision
      type: string
      description: |-
        * `aprobado` - Aprobado
        * `placa_desconocida` - Placa desconocida
        * `saldo_insuficiente` - Saldo insuficiente
        * `revision` - Revisión manual
    FrameRequest:
      type: object
      properties:
        imagen:
          type: string
          format: binary
        caseta_id:
          type: integer
      required:
      - caseta_id
      - imagen
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
      required:
      - id_token
    NullEnum:
      enum:
      - null
    Paso:
      type: object
      properties:
        id:
