<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Peaje Inteligente | Acceso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(
                135deg,
                #071426,
                #163858
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            padding: 45px;
            border-radius: 20px;
            width: 440px;
            max-width: 94%;
            box-shadow: 0 20px 60px #0005;
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #163858;
            font-weight: bold;
        }

        .google-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 14px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin-top: 30px;
        }

        .google-button:hover {
            background: #f0f4f8;
        }

        .google-button img {
            width: 23px;
        }

        .footer {
            color: #888;
            font-size: 12px;
            margin-top: 30px;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">🚘</div>

        <h2>Peaje Inteligente</h2>

        <p class="text-secondary">
            Sistema de control vehicular
            mediante inteligencia artificial
        </p>

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}

        <a href="{% url 'google_login' %}"
           class="google-button">

            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                 alt="Google">

            Iniciar sesión con Google

        </a>

        <div class="footer">

            Acceso exclusivo para usuarios autorizados.

            <hr>

            UNIFRANZ — Machine Learning 2026

        </div>

    </div>

</body>

</html>
